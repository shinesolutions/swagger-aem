---
name: Publish Java
'on':
  push:
    tags:
      - '*'
permissions:
  contents: read
jobs:
  build:
    # Fail a hung build instead of running to GitHub's 6 hour default
    timeout-minutes: 60
    runs-on: ubuntu-24.04
    container: shinesolutions/aem-platform-buildenv:6.5.0
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main
      - env:
          MAVEN_CENTRAL_USERNAME: ${{ secrets.SHINEOPENSOURCE_MVNREPOSITORY_TOKEN_USERNAME }}
          MAVEN_CENTRAL_PASSWORD: ${{ secrets.SHINEOPENSOURCE_MVNREPOSITORY_TOKEN_PASSWORD }}
          MAVEN_GPG_KEY: ${{ secrets.SHINEOPENSOURCE_MAVEN_GPG_KEY }}
          MAVEN_GPG_PASSPHRASE: ${{ secrets.SHINEOPENSOURCE_MAVEN_GPG_PASSPHRASE }}
        run: |
          make -f Makefile-extras build-java test-java &&
          make -f Makefile-extras publish-java
