---
# CodeQL code scanning, based on the CodeQL workflow in cliffano/rtk
name: CodeQL

on:
  push:
    branches: [main]
  pull_request:
    # The branches below must be a subset of the branches above
    branches: [main]
  schedule:
    - cron: '0 1 * * 0'

jobs:
  analyze:
    name: Analyze
    runs-on: ubuntu-26.04
    permissions:
      actions: read
      contents: read
      security-events: write
      pull-requests: read
    strategy:
      fail-fast: false
      matrix:
        # The CodeQL-supported languages in this repo, plus `actions` to scan
        # the GitHub Actions workflows (Puppet, Shell and Groovy are not
        # supported by CodeQL)
        language: ['javascript-typescript', 'python', 'ruby', 'actions']
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          # We must fetch at least the immediate parents so that if this is
          # a pull request then we can checkout the head.
          fetch-depth: 2

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v4
        with:
          languages: ${{ matrix.language }}
          # Analyse the source without building it, instead of Autobuild:
          # builds here run inside the buildenv Docker image, which Autobuild
          # on the bare runner does not reproduce
          build-mode: none
          # clients/ holds generated API clients, not code maintained here
          config: |
            paths-ignore:
              - clients

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v4
        with:
          category: "/language:${{ matrix.language }}"
